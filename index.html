<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEM — Don't Forget Me</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#17151a;
    color:#302a2d;
    overflow-x:hidden;
    transition:background 2s,color 2s;
}

button{
    font-family:inherit;
}

#game{
    min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:50;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,0,0,.08);
    transition:1s;
}

#logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:6px;
}

#dayText{
    font-size:15px;
    font-weight:bold;
}

/* =========================
   HOUSE / ROOM
========================= */

#world{
    padding-top:65px;
    min-height:100vh;
}

#room{
    width:min(1200px,96%);
    height:760px;
    margin:25px auto;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:#cdb8a8;
    box-shadow:
        0 25px 70px rgba(0,0,0,.28),
        inset 0 0 100px rgba(0,0,0,.08);
    transition:
        background 2s,
        filter 2s,
        box-shadow 2s;
}

/* WALL */

.wall{
    position:absolute;
    inset:0 0 145px 0;
    background:
        linear-gradient(
            rgba(255,255,255,.2),
            rgba(255,255,255,.02)
        ),
        repeating-linear-gradient(
            90deg,
            #d9c9bc 0px,
            #d9c9bc 80px,
            #d5c4b7 81px,
            #d5c4b7 82px
        );
    transition:2s;
}

/* FLOOR */

.floor{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:150px;
    background:
        repeating-linear-gradient(
            90deg,
            #9b7762 0px,
            #9b7762 65px,
            #886652 66px,
            #886652 68px
        );
    box-shadow:inset 0 15px 30px rgba(0,0,0,.18);
}

/* =========================
   WINDOW / BALCONY
========================= */

#window{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:300px;
    height:250px;
    background:#9fc0d0;
    border:14px solid #eee2d8;
    box-shadow:
        0 8px 25px rgba(0,0,0,.22),
        inset 0 0 30px rgba(255,255,255,.2);
    overflow:hidden;
    transition:2s;
}

.windowSky{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            #83b6d1,
            #d9e8ee 70%,
            #b6c8cf
        );
    transition:2s;
}

.windowMoon{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    right:35px;
    top:25px;
    background:#fff9d8;
    box-shadow:0 0 25px rgba(255,249,216,.9);
    opacity:0;
    transition:2s;
}

.windowCity{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:
        linear-gradient(
            to top,
            #5c666b 0 30%,
            transparent 30%
        );
}

.windowCity:after{
    content:"";
    position:absolute;
    bottom:0;
    left:15px;
    width:35px;
    height:55px;
    background:#555e63;
    box-shadow:
        55px -20px #4d565b,
        110px 5px #596267,
        170px -30px #4e585d,
        220px -5px #525b60;
}

/* CURTAINS */

.curtain{
    position:absolute;
    top:45px;
    width:80px;
    height:300px;
    background:
        repeating-linear-gradient(
            90deg,
            #b98c99 0px,
            #b98c99 15px,
            #a77b88 16px,
            #a77b88 27px
        );
    z-index:4;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
    transition:2s;
}

.curtain.left{
    left:calc(50% - 230px);
    border-radius:0 0 35px 10px;
}

.curtain.right{
    right:calc(50% - 230px);
    border-radius:0 0 10px 35px;
}

/* BALCONY DOOR */

#balconyDoor{
    position:absolute;
    left:30px;
    top:105px;
    width:180px;
    height:300px;
    background:#536875;
    border:10px solid #eee2d8;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:2s;
}

#balconyDoor .glass{
    position:absolute;
    inset:12px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.2),
            rgba(0,0,0,.18)
        ),
        #91aeb9;
}

#balconyDoor .handle{
    position:absolute;
    right:25px;
    top:50%;
    width:10px;
    height:40px;
    background:#c8b69b;
    border-radius:10px;
}

/* =========================
   BED
========================= */

#bed{
    position:absolute;
    right:45px;
    bottom:100px;
    width:380px;
    height:250px;
}

.bedFrame{
    position:absolute;
    bottom:0;
    width:100%;
    height:125px;
    background:#6e4d43;
    border-radius:15px;
    box-shadow:0 15px 25px rgba(0,0,0,.25);
}

.mattress{
    position:absolute;
    left:15px;
    right:15px;
    top:35px;
    height:100px;
    background:#eee3d8;
    border-radius:22px;
    box-shadow:0 8px 15px rgba(0,0,0,.12);
}

.blanket{
    position:absolute;
    left:15px;
    right:15px;
    top:75px;
    height:100px;
    border-radius:0 0 20px 20px;
    background:
        linear-gradient(
            135deg,
            #8b9da6,
            #71858e
        );
}

.pillow{
    position:absolute;
    top:42px;
    right:30px;
    width:110px;
    height:60px;
    background:#f8f2eb;
    border-radius:25px;
}

/* =========================
   DESK
========================= */

#desk{
    position:absolute;
    left:260px;
    bottom:110px;
    width:260px;
    height:190px;
}

.deskTop{
    position:absolute;
    top:0;
    width:100%;
    height:28px;
    background:#73564c;
    border-radius:8px;
}

.deskLeg{
    position:absolute;
    top:25px;
    width:20px;
    height:165px;
    background:#60463e;
}

.deskLeg.one{left:25px}
.deskLeg.two{right:25px}

/* LAMP */

#lamp{
    position:absolute;
    left:85px;
    top:-80px;
    width:100px;
    height:100px;
}

.lampShade{
    position:absolute;
    left:10px;
    top:0;
    width:80px;
    height:50px;
    background:#d5b57e;
    border-radius:50% 50% 20% 20%;
}

.lampLight{
    position:absolute;
    left:-30px;
    top:35px;
    width:160px;
    height:150px;
    background:radial-gradient(
        ellipse,
        rgba(255,221,151,.4),
        transparent 70%
    );
    pointer-events:none;
    transition:1s;
}

/* =========================
   RUG
========================= */

#rug{
    position:absolute;
    left:420px;
    bottom:30px;
    width:360px;
    height:100px;
    border-radius:50%;
    background:
        repeating-linear-gradient(
            90deg,
            #b38e91 0px,
            #b38e91 30px,
            #a47f82 31px,
            #a47f82 60px
        );
    opacity:.9;
}

/* =========================
   MEM
========================= */

#mem{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    width:170px;
    height:320px;
    z-index:10;
    transition:
        filter 1s,
        transform .4s,
        opacity 1s;
}

.memHair{
    position:absolute;
    top:15px;
    left:25px;
    width:120px;
    height:150px;
    background:
        linear-gradient(
            120deg,
            #4d344d,
            #6d4869
        );
    border-radius:60px 60px 45px 45px;
    z-index:1;
}

.memHair:after{
    content:"";
    position:absolute;
    left:-5px;
    top:70px;
    width:35px;
    height:120px;
    background:#4d344d;
    border-radius:30px;
    transform:rotate(12deg);
}

.memFace{
    position:absolute;
    left:32px;
    top:35px;
    width:106px;
    height:120px;
    background:
        linear-gradient(
            135deg,
            #ffd6bd,
            #eab49d
        );
    border-radius:50% 50% 47% 47%;
    z-index:2;
    box-shadow:inset -8px -10px 15px rgba(100,50,40,.08);
}

.memEye{
    position:absolute;
    top:54px;
    width:13px;
    height:17px;
    background:#342837;
    border-radius:50%;
    transition:.8s;
}

.memEye.left{left:25px}
.memEye.right{right:25px}

.memMouth{
    position:absolute;
    left:40px;
    top:88px;
    width:28px;
    height:12px;
    border-bottom:3px solid #a95e6e;
    border-radius:50%;
    transition:.8s;
}

.memBody{
    position:absolute;
    left:20px;
    top:145px;
    width:130px;
    height:135px;
    background:
        linear-gradient(
            135deg,
            #a7c8c2,
            #759d99
        );
    border-radius:35px 35px 20px 20px;
    z-index:1;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.memCollar{
    position:absolute;
    left:42px;
    top:0;
    width:45px;
    height:35px;
    background:#e8d7c8;
    border-radius:0 0 30px 30px;
}

.memHeart{
    position:absolute;
    left:51px;
    top:55px;
    font-size:26px;
    color:#d97e91;
}

.memArm{
    position:absolute;
    top:160px;
    width:30px;
    height:100px;
    background:#efbea7;
    border-radius:25px;
    z-index:0;
}

.memArm.left{
    left:2px;
    transform:rotate(12deg);
}

.memArm.right{
    right:2px;
    transform:rotate(-12deg);
}

/* =========================
   MEM HORROR STATES
========================= */

.memHorror{
    filter:
        grayscale(.7)
        contrast(1.5)
        brightness(.7);
}

.memHorror .memHair{
    background:#151118;
}

.memHorror .memFace{
    background:#cda99b;
}

.memHorror .memEye{
    height:27px;
    width:15px;
    background:#09070a;
    box-shadow:0 0 10px rgba(0,0,0,.8);
}

.memHorror .memMouth{
    width:40px;
    height:30px;
    left:33px;
    border:0;
    border-radius:0 0 30px 30px;
    background:#21151a;
}

.memHorror .memHeart{
    opacity:0;
}

/* =========================
   NIGHT MODE
========================= */

body.night #topbar{
    background:rgba(15,15,22,.72);
    color:#eee;
    border-color:#292933;
}

body.night #room{
    background:#161720;
    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        inset 0 0 150px rgba(0,0,0,.45);
}

body.night .wall{
    background:
        linear-gradient(
            rgba(18,20,31,.72),
            rgba(8,9,15,.94)
        ),
        #80726e;
}

body.night .windowSky{
    background:
        linear-gradient(
            #10182b,
            #172238 65%,
            #0c101a
        );
}

body.night .windowMoon{
    opacity:1;
}

body.night .curtain{
    background:
        repeating-linear-gradient(
            90deg,
            #4a3741 0px,
            #4a3741 15px,
            #3b2b35 16px,
            #3b2b35 27px
        );
}

body.night .lampLight{
    opacity:.85;
}

/* =========================
   ACTIONS
========================= */

#interface{
    width:min(1100px,94%);
    margin:0 auto 40px;
}

#message{
    min-height:60px;
    padding:18px 22px;
    border-radius:16px;
    background:rgba(255,255,255,.88);
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    text-align:center;
    font-size:17px;
    line-height:1.8;
    transition:1s;
}

body.night #message{
    background:rgba(20,20,28,.9);
    color:#eee;
}

#actions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin-top:15px;
}

.action{
    padding:15px;
    border:0;
    border-radius:14px;
    background:#fff;
    color:#342d31;
    cursor:pointer;
    font-size:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.2s;
}

.action:hover{
    transform:translateY(-3px);
}

.action:active{
    transform:scale(.96);
}

body.night .action{
    background:#191922;
    color:#eee;
    border:1px solid #30303c;
}

.danger{
    background:#30212c !important;
    color:white !important;
}

/* =========================
   STATS
========================= */

#stats{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:rgba(255,255,255,.78);
    padding:13px;
    border-radius:14px;
}

body.night .stat{
    background:#17171f;
    color:#ddd;
}

.bar{
    height:8px;
    margin-top:8px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:50%;
    background:#8ba9a2;
    transition:.5s;
}

/* =========================
   JUMPSCARE
========================= */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center;
    background:#050507;
}

#jumpscare.show{
    display:flex;
    animation:flash .18s steps(2);
}

@keyframes flash{
    0%{filter:brightness(4)}
    50%{filter:brightness(.3)}
    100%{filter:brightness(1)}
}

.scareFace{
    width:320px;
    height:420px;
    position:relative;
    transform:scale(1.5);
    animation:scareZoom .8s forwards;
}

@keyframes scareZoom{
    from{
        transform:scale(.2) rotate(-4deg);
        opacity:0;
    }
    to{
        transform:scale(1.4);
        opacity:1;
    }
}

.scareHair{
    position:absolute;
    width:260px;
    height:340px;
    left:30px;
    top:10px;
    border-radius:50%;
    background:#08070b;
}

.scareHead{
    position:absolute;
    width:210px;
    height:260px;
    left:55px;
    top:70px;
    border-radius:50%;
    background:#bca19c;
}

.scareEye{
    position:absolute;
    top:105px;
    width:30px;
    height:55px;
    border-radius:50%;
    background:#050505;
}

.scareEye.left{left:40px}
.scareEye.right{right:40px}

.scareMouth{
    position:absolute;
    left:70px;
    top:185px;
    width:70px;
    height:50px;
    background:#080508;
    border-radius:0 0 50px 50px;
}

#scareText{
    position:absolute;
    bottom:45px;
    left:0;
    right:0;
    text-align:center;
    color:#fff;
    font-size:24px;
}

/* =========================
   GLITCH
========================= */

.glitch{
    animation:glitch .13s infinite;
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(7px,-2px)}
    50%{transform:translate(-6px,3px)}
    75%{transform:translate(3px,1px)}
    100%{transform:translate(0)}
}

/* =========================
   END
========================= */

#ending{
    position:fixed;
    inset:0;
    background:#050507;
    color:#eee;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    z-index:500;
}

#endingBox{
    max-width:650px;
    line-height:2;
}

#ending button{
    margin-top:20px;
    padding:15px 30px;
    border:0;
    border-radius:12px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #room{
        height:700px;
    }

    #window{
        width:230px;
        height:190px;
    }

    .curtain.left{
        left:10px;
        opacity:.6;
    }

    .curtain.right{
        right:10px;
        opacity:.6;
    }

    #bed{
        right:10px;
        width:280px;
        transform:scale(.85);
        transform-origin:right bottom;
    }

    #desk{
        left:10px;
        transform:scale(.75);
        transform-origin:left bottom;
    }

    #rug{
        left:50%;
        transform:translateX(-50%);
        width:260px;
    }

    #stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="game">

<div id="topbar">
    <div id="logo">MEM</div>
    <div id="dayText">اليوم 1 — صباحًا</div>
</div>

<div id="world">

<div id="room">

    <div class="wall"></div>
    <div class="floor"></div>

    <div id="window">
        <div class="windowSky"></div>
        <div class="windowMoon"></div>
        <div class="windowCity"></div>
    </div>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div id="balconyDoor">
        <div class="glass"></div>
        <div class="handle"></div>
    </div>

    <div id="desk">
        <div class="deskTop"></div>
        <div class="deskLeg one"></div>
        <div class="deskLeg two"></div>

        <div id="lamp">
            <div class="lampShade"></div>
            <div class="lampLight"></div>
        </div>
    </div>

    <div id="rug"></div>

    <div id="bed">
        <div class="bedFrame"></div>
        <div class="mattress"></div>
        <div class="blanket"></div>
        <div class="pillow"></div>
    </div>

    <!-- MEM -->

    <div id="mem">

        <div class="memHair"></div>

        <div class="memFace">
            <div class="memEye left"></div>
            <div class="memEye right"></div>
            <div class="memMouth"></div>
        </div>

        <div class="memArm left"></div>
        <div class="memArm right"></div>

        <div class="memBody">
            <div class="memCollar"></div>
            <div class="memHeart">♥</div>
        </div>

    </div>

</div>

<div id="interface">

    <div id="message">
        Mem تنتظرك في غرفتها.
    </div>

    <div id="actions"></div>

    <div id="stats">

        <div class="stat">
            طعام Mem
            <div class="bar">
                <div id="foodBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            ماء Mem
            <div class="bar">
                <div id="waterBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            سعادة Mem
            <div class="bar">
                <div id="happyBar" class="fill"></div>
            </div>
        </div>

    </div>

</div>

</div>
</div>


<!-- JUMPSCARE -->

<div id="jumpscare">

    <div class="scareFace">

        <div class="scareHair"></div>

        <div class="scareHead">

            <div class="scareEye left"></div>
            <div class="scareEye right"></div>

            <div class="scareMouth"></div>

        </div>

    </div>

    <div id="scareText">
        Mem لم تكن نائمة.
    </div>

</div>


<!-- ENDING -->

<div id="ending">

    <div id="endingBox">

        <h1>MEM</h1>

        <p id="endingText"></p>

        <button onclick="location.reload()">
            اللعب من جديد
        </button>

    </div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let day = 1;
let phase = "morning";

let memFood = 50;
let memWater = 50;
let memHappy = 50;

let playerFood = 60;
let playerWater = 60;
let playerSleep = 60;

let teethDone = false;

let searchedRoom = false;
let searchedHall = false;
let balconyFound = false;

let horrorLevel = 0;
let nightCount = 0;

const mem = document.getElementById("mem");
const message = document.getElementById("message");
const actions = document.getElementById("actions");
const dayText = document.getElementById("dayText");
const room = document.getElementById("room");

/* ==========================================
   HELPERS
========================================== */

function say(text){

    message.innerHTML = text;

}

function clearActions(){

    actions.innerHTML = "";

}

function button(text,fn,cls=""){

    const b = document.createElement("button");

    b.className = "action " + cls;

    b.innerText = text;

    b.onclick = fn;

    actions.appendChild(b);

}

function updateBars(){

    document.getElementById("foodBar").style.width =
        memFood + "%";

    document.getElementById("waterBar").style.width =
        memWater + "%";

    document.getElementById("happyBar").style.width =
        memHappy + "%";

}

function setDay(text){

    dayText.innerText = text;

}

function night(){

    document.body.classList.add("night");

}

function dayMode(){

    document.body.classList.remove("night");

}

function horror(){

    horrorLevel++;

    if(horrorLevel >= 2){

        mem.classList.add("memHorror");

    }

}

/* ==========================================
   AUDIO
   All sounds are generated by browser.
========================================== */

let audioCtx = null;

function audio(){

    if(!audioCtx){

        audioCtx =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    return audioCtx;
}

function beep(freq=200,duration=.2,type="sine",volume=.04){

    try{

        const ctx = audio();

        const osc = ctx.createOscillator();

        const gain = ctx.createGain();

        osc.type = type;

        osc.frequency.value = freq;

        gain.gain.value = volume;

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + duration
        );

        osc.stop(ctx.currentTime + duration);

    }catch(e){}

}

function scarySound(){

    beep(70,.7,"sawtooth",.08);

    setTimeout(
        ()=>beep(40,.5,"triangle",.06),
        200
    );

}
